      summary: "Native Codex Worker added scoped nonisolated annotations to value/helper types and preserved bookmark behavior. Swift 6 build advanced past the original AppPaths.bookmark callback errors but stopped on ResultsView.swift:917, which was outside T004 allowed_files."
      remaining_blockers:
