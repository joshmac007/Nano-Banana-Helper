version: 2

goal:
  title: "Nano Banana Audit Fixes"
  slug: "nano-banana-audit-fixes"
  kind: existing_plan
  tranche: "Implement and verify the five audited reliability fixes using bounded Worker slices, Judge review, and GitNexus impact/change checks where available."
  status: complete
  intake:
    original_request: "Use subagents to build out the audited fixes, reviewers afterwards, and GitNexus when needed to keep changes tight."
    interpreted_outcome: "All five audited Nano Banana Helper issues are fixed with scoped implementation, regression tests, verification, and final review."
    input_shape: existing_plan
    audience: "Nano Banana Helper owner and app users"
    authority: approved
    proof_type: test
    completion_proof: "Focused tests and relevant builds pass, Swift 6 readiness is verified or explicitly blocked with evidence, GitNexus impact/change checks are recorded when available, and final Judge audit confirms all five original findings are closed."
    likely_misfire: "Stopping at planning, fixing only the easy UI guard, or applying broad refactors that do not close all five audited behaviors."
    blind_spots_considered:
      - "GoalBuddy Codex agent roles may need installation before true goal_scout/goal_worker/goal_judge dispatch."
      - "GitNexus may be unavailable or stale; the PM must record that truthfully and use narrow manual fallback only when allowed."
      - "Swift 6 may expose layered compiler errors after the first failures are fixed."
      - "Bookmark/output fixes must preserve sandbox security instead of bypassing it."
      - "Thumbnail async work must keep security-scoped access and avoid main-thread file I/O."
    existing_plan_facts:
      - "P1 Swift concurrency debt is hidden by Swift 5 mode; README claims Swift 6 while project configs set SWIFT_VERSION = 5.0."
      - "P2 OpenAI non-multi-input mask handling applies one mask to every staged file and can poison multi-file Batch Tier submissions."
      - "P2 Settings can delete the last project; ProjectManager can leave currentProject nil."
      - "P2 History resume can lose the original output folder when no bookmark exists."
      - "P2 Staging thumbnails synchronously read full image data during SwiftUI rendering."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed
  note: "Bundled GoalBuddy agent templates exist; Codex-visible goal_scout/goal_worker/goal_judge roles were not verified during prep. The first PM task must verify/install or fall back truthfully before dispatch."

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/nano-banana-audit-fixes/"
    command: "npx goalbuddy board docs/goals/nano-banana-audit-fixes"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Verify GoalBuddy agent dispatch readiness and GitNexus availability, then update the board with truthful execution constraints before implementation."
    inputs:
      - "GoalBuddy bundled agent templates"
      - "Current Codex spawn_agent role availability"
      - "Repo GitNexus instructions from AGENTS.md/project docs"
      - "docs/goals/nano-banana-audit-fixes/state.yaml"
    constraints:
      - "Control-file-only writes."
      - "Do not inspect implementation code beyond what is necessary to verify tool availability."
      - "Do not implement fixes in this task."
      - "If goal_scout/goal_worker/goal_judge roles are unavailable, record the installation/fallback path before any attempted subagent dispatch."
    expected_output:
      - "Agent availability status"
      - "GitNexus availability/staleness status"
      - "Updated board constraints or setup task if needed"
      - "Receipt stating whether parallel subagent implementation can proceed"
    receipt:
      result: done
      summary: "GoalBuddy update check passed. Bundled GoalBuddy agent templates and Claude-side configs exist, but this Codex session exposes only default/explorer/worker spawn roles, not goal_scout/goal_worker/goal_judge. GitNexus CLI is usable with an up-to-date Nano-Banana-Helper index at commit 4209a6d. Proceed with PM-supervised fallback and native Codex subagents where bounded; record GitNexus CLI/MCP limitations truthfully before edits."
      evidence:
        - "npx --yes goalbuddy prompt \"$PWD/docs/goals/nano-banana-audit-fixes\""
        - "npx --yes --package gitnexus@latest gitnexus status"
        - ".gitnexus/meta.json"
      facts:
        - "GoalBuddy dedicated Codex spawn roles unavailable in current tool schema."
        - "GitNexus index current: indexed commit 4209a6d equals current commit 4209a6d."
        - "GitNexus MCP tools were not exposed through tool_search; CLI status/list are available."
      contradictions:
        - "User asked for subagents, but GoalBuddy-specific subagent role names are not callable in this Codex session."
      ambiguity_requiring_judge:
        - "Whether to treat native Codex explorer/worker agents as acceptable fallback for GoalBuddy Scout/Worker/Judge tasks."
  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Refresh evidence for the five audited findings and map exact affected symbols, tests, and verification commands."
    inputs:
      - "Audit findings in goal.md"
      - "Repo source files and tests"
      - "GitNexus query/context/impact tools when available"
    constraints:
      - "Read-only."
      - "Prefer GitNexus for unfamiliar execution flows when available."
      - "Report exact files, symbols, call chains, and tests; do not propose broad refactors."
    expected_output:
      - "Evidence map for all five findings"
      - "Affected symbols requiring impact analysis"
      - "Recommended Worker slices with allowed_files candidates"
      - "Focused test/build commands"
    receipt:
      result: done
      summary: "Evidence refreshed for all five findings. Swift 6 override build still fails on MainActor-inferred AppPaths.bookmark default callback usage. GitNexus CLI is available/current but query/impact are degraded for these Swift symbols, returning target-not-found or no definitions; use source-call evidence as fallback and keep GitNexus detect-changes for final scope."
      evidence:
        - "docs/goals/nano-banana-audit-fixes/notes/T002-evidence-map.md"
        - "rtk proxy xcodebuild build ... SWIFT_VERSION=6.0 ... CODE_SIGNING_ALLOWED=NO"
        - "gitnexus impact --repo Nano-Banana-Helper --depth 2 --include-tests <target>"
      facts:
        - "All five findings remain reproducible from current source."
        - "Current GitNexus index is present but not sufficient for symbol-level impact on the target Swift symbols."
        - "Tests exist near every finding, but missing regressions for multi-file mask handling, last-project deletion, nil-bookmark history resume output path, and staging thumbnail async behavior."
      contradictions:
        - "Repo requires GitNexus impact before symbol edits, but GitNexus returns UNKNOWN for key Swift symbols; Judge must approve source-evidence fallback per slice."
      ambiguity_requiring_judge:
        - "Whether to group the three data-safety fixes into one Worker slice or keep them separate because they share the large unit test file."
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose safe implementation slices and parallelization boundaries for the five fixes."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "Current dirty diff"
    constraints:
      - "Do not implement."
      - "Require GitNexus impact evidence or an explicit unavailable fallback before any symbol edit."
      - "Prefer the largest safe useful slices; only split Workers when write scopes are disjoint and verification remains clear."
    expected_output:
      - "Implementation sequencing decision"
      - "Parallel Worker plan if safe"
      - "Each Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      evidence:
        - "docs/goals/nano-banana-audit-fixes/notes/T002-evidence-map.md"
        - "git status --short showed only pre-existing CLAUDE.md change plus GoalBuddy files before implementation."
      blocked_tasks: []
      required_board_updates:
        - "Use sequential Worker slices; do not parallelize writes because Nano_Banana_HelperTests.swift is shared and Models.swift may be touched by multiple slices."
        - "Approve native Codex worker fallback for implementation only because GoalBuddy goal_worker is unavailable and user explicitly requested subagents."
        - "For every Worker, treat GitNexus symbol impact UNKNOWN as not-low-risk; use source evidence, focused tests, and final gitnexus detect-changes as fallback."
        - "Run T004 Swift 6 readiness first because it is the highest-risk compiler gate and may expose layered follow-up errors."
  - id: T004
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: medium
    objective: "Implement the Swift 6 concurrency-readiness slice selected by Judge."
    allowed_files:
